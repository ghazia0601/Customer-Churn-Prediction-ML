<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churn Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <div class="bg-white p-8 rounded shadow-md w-full max-w-2xl">
        <h2 class="text-2xl font-bold mb-6 text-center">Customer Churn Prediction</h2>
        
        <!-- Prediction Result -->
        {% if prediction_text %}
        <div class="mb-4 p-4 bg-blue-100 text-blue-800 rounded">
            {{ prediction_text }}
        </div>
        {% endif %}
        
        <form action="/predict" method="post" class="space-y-4">

            <!-- Gender -->
            <div>
                <label class="block mb-1 font-semibold">Gender</label>
                <select name="gender" class="w-full border rounded p-2">
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                </select>
            </div>

            <!-- Senior Citizen -->
            <div>
                <label class="block mb-1 font-semibold">Senior Citizen</label>
                <select name="SeniorCitizen" class="w-full border rounded p-2">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <!-- Partner -->
            <div>
                <label class="block mb-1 font-semibold">Partner</label>
                <select name="Partner" class="w-full border rounded p-2">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                </select>
            </div>

            <!-- Dependents -->
            <div>
                <label class="block mb-1 font-semibold">Dependents</label>
                <select name="Dependents" class="w-full border rounded p-2">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                </select>
            </div>

            <!-- Tenure -->
            <div>
                <label class="block mb-1 font-semibold">Tenure (months)</label>
                <input type="number" name="tenure" class="w-full border rounded p-2" min="0">
            </div>

            <!-- PhoneService -->
            <div>
                <label class="block mb-1 font-semibold">Phone Service</label>
                <select name="PhoneService" class="w-full border rounded p-2">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                </select>
            </div>

            <!-- MultipleLines -->
            <div>
                <label class="block mb-1 font-semibold">Multiple Lines</label>
                <select name="MultipleLines" class="w-full border rounded p-2">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                     <option value="No phone service">No phone service</option>
                </select>
            </div>

            <!-- InternetService -->
            <div>
                <label class="block mb-1 font-semibold">Internet Service</label>
                <select name="InternetService" class="w-full border rounded p-2">
                    <option value="DSL">DSL</option>
                    <option value="Fiber optic">Fiber Optic</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- OnlineSecurity -->
            <div>
                <label class="block mb-1 font-semibold">Online Security</label>
                <select name="OnlineSecurity" class="w-full border rounded p-2">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <!-- OnlineBackup -->
            <div>
                <label class="block mb-1 font-semibold">Online Backup</label>
                <select name="OnlineBackup" class="w-full border rounded p-2">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <!-- DeviceProtection -->
            <div>
                <label class="block mb-1 font-semibold">Device Protection</label>
                <select name="DeviceProtection" class="w-full border rounded p-2">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <!-- TechSupport -->
            <div>
                <label class="block mb-1 font-semibold">Tech Support</label>
                <select name="TechSupport" class="w-full border rounded p-2">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <!-- StreamingTV -->
            <div>
                <label class="block mb-1 font-semibold">Streaming TV</label>
                <select name="StreamingTV" class="w-full border rounded p-2">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <!-- StreamingMovies -->
            <div>
                <label class="block mb-1 font-semibold">Streaming Movies</label>
                <select name="StreamingMovies" class="w-full border rounded p-2">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <!-- Contract -->
            <div>
                <label class="block mb-1 font-semibold">Contract</label>
                <select name="Contract" class="w-full border rounded p-2">
                    <option value="Month-to-month">Month-to-month</option>
                    <option value="One year">One Year</option>
                    <option value="Two year">Two Year</option>
                </select>
            </div>

            <!-- PaperlessBilling -->
            <div>
                <label class="block mb-1 font-semibold">Paperless Billing</label>
                <select name="PaperlessBilling" class="w-full border rounded p-2">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                </select>
            </div>

            <!-- PaymentMethod -->
            <div>
                <label class="block mb-1 font-semibold">Payment Method</label>
                <select name="PaymentMethod" class="w-full border rounded p-2">
                    <option value="Electronic check">Electronic check</option>
                    <option value="Mailed check">Mailed check</option>
                    <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                    <option value="Credit card (automatic)">Credit card (automatic)</option>
                </select>
            </div>

            <!-- MonthlyCharges -->
            <div>
                <label class="block mb-1 font-semibold">Monthly Charges</label>
                <input type="number" step="0.01" name="MonthlyCharges" class="w-full border rounded p-2" min="0">
            </div>

            <!-- TotalCharges -->
            <div>
                <label class="block mb-1 font-semibold">Total Charges</label>
                <input type="number" step="0.01" name="TotalCharges" class="w-full border rounded p-2" min="0">
            </div>

            <!-- Submit Button -->
            <div class="text-center">
                <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
                    Predict Churn
                </button>
            </div>
        </form>
    </div>

</body>
</html>
